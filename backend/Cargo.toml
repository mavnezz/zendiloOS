[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The version of the newest entry in debian/changelog (`just version-check`).
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates. Which crate may depend on which is documented in
# docs/architecture.md, section 2.1.
zendiloos-agent = { path = "crates/zendiloos-agent" }
zendiloos-agent-proto = { path = "crates/zendiloos-agent-proto" }
zendiloos-api = { path = "crates/zendiloos-api" }
zendiloos-apps = { path = "crates/zendiloos-apps" }
zendiloos-containers = { path = "crates/zendiloos-containers" }
zendiloos-updates = { path = "crates/zendiloos-updates" }
zendiloos-exec = { path = "crates/zendiloos-exec" }
zendiloos-fileops = { path = "crates/zendiloos-fileops" }
zendiloos-identity = { path = "crates/zendiloos-identity" }
zendiloos-infra = { path = "crates/zendiloos-infra" }
zendiloos-jobs = { path = "crates/zendiloos-jobs" }
zendiloos-kernel = { path = "crates/zendiloos-kernel" }
zendiloos-logging = { path = "crates/zendiloos-logging" }
zendiloos-certificates = { path = "crates/zendiloos-certificates" }
zendiloos-firewall = { path = "crates/zendiloos-firewall" }
zendiloos-network = { path = "crates/zendiloos-network" }
zendiloos-notify = { path = "crates/zendiloos-notify" }
zendiloos-sharing = { path = "crates/zendiloos-sharing" }
zendiloos-sim = { path = "crates/zendiloos-sim" }
zendiloos-storage = { path = "crates/zendiloos-storage" }
zendiloos-system = { path = "crates/zendiloos-system" }

# The app format and its policy, from the community catalog, pinned: a
# change to the checks reaches zendiloOS only when this commit is moved.
zendiloos-catalog = { git = "https://github.com/mavnezz/zendiloOS.community.applications", rev = "0e2a26040b440294c3ec5c80140e6eecc1bcd9a1" }

anyhow = "1"
argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
# YAML events with their places in the text: the App Center fills in a
# template's values and leaves the rest of the file as written. The same
# parser the catalog's YAML reader (serde-saphyr) is built on.
granit-parser = "2.1"
# Two-factor sign-in: TOTP (RFC 6238) is HMAC-SHA-1, as authenticator apps compute it.
hmac = "0.13"
sha1 = "0.11"
http-body-util = "0.1"
# Notification channels: webhooks over hyper's own client, mail with
# lettre; TLS by rustls with ring and the system's certificates.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# HTTP dates (Last-Modified) for resumable downloads.
httpdate = "1"
# The host's time zone (/etc/localtime) for schedules in local time.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
listenfd = "1"
# Safe wrappers for the system calls the files agent needs: per-thread
# credentials, openat2 and descriptor passing.
rustix = { version = "1.1", features = ["fs", "net", "thread", "process", "rand"] }
serde = { version = "1", features = ["derive"] }
# YAML as the catalog reads it, for the simulation's stand-in for Compose.
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.11"
# Releases of zendiloOS are checked against their minisign signature.
minisign-verify = "0.2"
# SQLite is bundled, so every build runs against the same, known version.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "network", "component"] }
# Backups of Docker's volumes: tar archives compressed with zstd, which
# Debian's tar and zstd read as well.
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util", "process"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "6"
utoipa-axum = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
