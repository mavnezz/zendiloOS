# cargo-deny (`just deny`, part of `just check`): licenses, advisories,
# duplicate and unknown sources.

[graph]
all-features = true

[advisories]
# Security advisories fail the check; unmaintained crates are reported.
yanked = "deny"
ignore = [
    # SQLite before 3.54 can return stale page-cache bytes when it opens a
    # database together with a crafted -wal file of another page size.
    # zendiloosd opens only its own database in /var/lib/zendiloos (0700,
    # the service's alone), so no less trusted party writes the files it
    # opens. The fixed libsqlite3-sys 0.39 needs an sqlx newer than 0.9.0,
    # which allows < 0.38; drop this once sqlx takes it.
    { id = "RUSTSEC-2026-0459", reason = "only our own database is opened; fixed libsqlite3-sys needs a newer sqlx" },
    # Unmaintained, not vulnerable: both come with age (configuration
    # backups, 4.15) through i18n-embed, which words age's errors.
    # proc-macro-error2 runs only while compiling (i18n-embed-fl's macro),
    # basic-toml reads age's own embedded i18n.toml, never input from
    # elsewhere. age 0.12 still has the second and adds crates with a
    # vulnerability; drop these once age's i18n has moved on.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: a compile-time helper of i18n-embed-fl's macro, which age uses" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml: reads age's embedded i18n configuration only" },
]

[licenses]
# Permissive licenses compatible with zendiloos's Apache-2.0. Anything else
# needs a deliberate decision here.
allow = [
    # quoted_printable (mail bodies in lettre): no conditions at all.
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # ring and rustls-webpki (TLS for notification channels): permissive,
    # equivalent to MIT.
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The app format and its policy (zendiloos-catalog), pinned by commit.
allow-git = ["https://github.com/mavnezz/zendiloOS.community.applications"]
