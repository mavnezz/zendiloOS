[package]
name = "zendiloos-recovery"
description = "Bounded context Recovery: the configuration backed up by hand or on a schedule, encrypted, and restored on this or a fresh installation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Core crate of a bounded context: no I/O, no frameworks. Adapters live in
# zendiloos-infra and zendiloos-api. See docs/architecture.md, 2.1.
[dependencies]
zendiloos-kernel.workspace = true
zendiloos-jobs.workspace = true
zendiloos-notify.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
zendiloos-jobs = { workspace = true, features = ["testing"] }
zendiloos-notify = { workspace = true, features = ["testing"] }

[features]
# In-memory adapters, for tests here and in the API crate.
testing = ["zendiloos-jobs/testing", "zendiloos-notify/testing"]

[lints]
workspace = true
