# UGREEN DXP4800 Plus: four 3.5" bays at the front, two M.2 NVMe slots
# underneath and the system's own M.2 SSD inside.
#
# From the owner's machine running UGOS (2026-11): DMI names, the ports
# of the bays (HCTL 0:0:0:0 is ata-1) and of the NVMe slots. The ATA ports
# agree with miskcoo/ugreen_leds_controller (MIT), which maps ataN to
# diskN. A USB stick showed up at pci-0000:00:0d.0-usb-0:1:1.0-scsi-0:0:0:0;
# the front's USB ports get no slot.
id = "ugreen-dxp4800-plus"
vendor = "UGREEN"
name = "DXP4800 Plus"
verified = false
notes = """
To confirm: the order of bays 1 to 4 (from ata-1 to ata-4, numbered left \
to right) and which slot underneath is printed "M.2 1" (here \
0000:01:00.0, the other 0000:02:00.0). Confirmed: four 3.5" bays at the \
front, two M.2 NVMe slots underneath, the 128 GB system SSD inside at \
0000:04:00.0. The M.2 slots have no activity light."""

[dmi]
sys_vendor = "UGREEN"
product_name = "DXP4800 Plus"

[chassis]
style = "tower"

[chassis.panel]
side = "left"
power_button = true
leds = ["power", "network", "disk1", "disk2", "disk3", "disk4"]

[[groups]]
id = "bays"
name = "Front bays"
rows = 1
columns = 4
orientation = "vertical"
form = "inch_3_5"
numbering = "left_to_right"
slots = [
    { id = "bay1", label = "Bay 1", port = "pci-0000:05:00.0-ata-1" },
    { id = "bay2", label = "Bay 2", port = "pci-0000:05:00.0-ata-2" },
    { id = "bay3", label = "Bay 3", port = "pci-0000:05:00.0-ata-3" },
    { id = "bay4", label = "Bay 4", port = "pci-0000:05:00.0-ata-4" },
]

[[groups]]
id = "m2"
name = "M.2 slots underneath"
rows = 1
columns = 2
orientation = "horizontal"
form = "m2"
numbering = "left_to_right"
slots = [
    { id = "m2-1", label = "M.2 1", port = "pci-0000:01:00.0-nvme-1" },
    { id = "m2-2", label = "M.2 2", port = "pci-0000:02:00.0-nvme-1" },
]

[[groups]]
id = "internal"
name = "Inside"
rows = 1
columns = 1
orientation = "horizontal"
form = "m2"
numbering = "left_to_right"
slots = [
    { id = "system", label = "System SSD", port = "pci-0000:04:00.0-nvme-1" },
]
