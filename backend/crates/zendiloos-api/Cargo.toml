[package]
name = "zendiloos-api"
description = "HTTP and WebSocket API of Zendiloos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Primary adapter: calls the contexts' use cases, never secondary adapters
# (no dependency on zendiloos-infra). See docs/architecture.md, 2.1.
[dependencies]
zendiloos-identity.workspace = true
zendiloos-jobs.workspace = true
zendiloos-notify.workspace = true
zendiloos-sharing.workspace = true
zendiloos-kernel.workspace = true
zendiloos-network.workspace = true
zendiloos-storage.workspace = true
zendiloos-system.workspace = true
axum.workspace = true
axum-extra.workspace = true
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
tokio = { workspace = true, features = ["time", "fs", "io-util", "rt"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
zendiloos-identity = { workspace = true, features = ["testing"] }
zendiloos-storage = { workspace = true, features = ["testing"] }
zendiloos-sharing = { workspace = true, features = ["testing"] }
zendiloos-jobs = { workspace = true, features = ["testing"] }
zendiloos-notify = { workspace = true, features = ["testing"] }
zendiloos-network = { workspace = true, features = ["testing"] }
async-trait.workspace = true
http-body-util.workspace = true
tokio.workspace = true
tower.workspace = true

[lints]
workspace = true
