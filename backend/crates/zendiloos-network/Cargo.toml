[package]
name = "zendiloos-network"
description = "Bounded context Network: interfaces, addresses, routes and name servers; taken over from ifupdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Core crate of a bounded context: no I/O, no frameworks. Adapters live in
# zendiloos-infra and zendiloos-api. See docs/architecture.md, 2.1.
[dependencies]
zendiloos-kernel.workspace = true
zendiloos-jobs.workspace = true
zendiloos-notify.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
zendiloos-jobs = { workspace = true, features = ["testing"] }
zendiloos-notify = { workspace = true, features = ["testing"] }
tokio.workspace = true

[features]
# A fixed network and a fake host, for tests.
testing = ["zendiloos-jobs/testing"]

[lints]
workspace = true
