[package]
name = "zendiloos-storage"
description = "Bounded context Storage: disks, SMART, RAID arrays and volumes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Core crate of a bounded context: no I/O, no frameworks. Adapters live in
# zendiloos-infra and zendiloos-api. See docs/architecture.md, 2.1.
[dependencies]
zendiloos-kernel.workspace = true
zendiloos-jobs.workspace = true
zendiloos-notify.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
zendiloos-jobs = { workspace = true, features = ["testing"] }
zendiloos-notify = { workspace = true, features = ["testing"] }

[features]
# Fakes for the ports, for tests of crates that use this context.
testing = ["zendiloos-jobs/testing", "zendiloos-notify/testing"]

[lints]
workspace = true
