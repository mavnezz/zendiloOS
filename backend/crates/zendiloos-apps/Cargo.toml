[package]
name = "zendiloos-apps"
description = "Bounded context Apps of Zendiloos: app catalogs and their sources, installed apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Core crate of a bounded context: no I/O, no frameworks. Reading catalogs
# and checking them against the policy (zendiloos-catalog) happens in
# zendiloos-infra. See docs/architecture.md, 2.1 and 4.9.
[dependencies]
zendiloos-kernel.workspace = true
zendiloos-jobs.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
zendiloos-jobs = { workspace = true, features = ["testing"] }
tokio.workspace = true

[features]
# In-memory sources and a catalog fetcher, for tests.
testing = []

[lints]
workspace = true
