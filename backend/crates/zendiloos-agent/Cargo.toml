[package]
name = "zendiloos-agent"
description = "The privileged zendiloos agent: a closed set of root operations over a Unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Everything here runs as root: keep this list short. The agent must never
# depend on the bounded contexts, the database or HTTP crates.
[dependencies]
zendiloos-agent-proto.workspace = true
zendiloos-exec.workspace = true
zendiloos-fileops.workspace = true
zendiloos-logging.workspace = true
anyhow.workspace = true
clap.workspace = true
listenfd.workspace = true
rustix = { workspace = true, features = ["thread", "process", "fs", "event", "mount", "system", "pipe"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
minisign-verify.workspace = true
# Backups of Docker's volumes (docs/architecture.md, 4.9).
tar.workspace = true
zstd.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
