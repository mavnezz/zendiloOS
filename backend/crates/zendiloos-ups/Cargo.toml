[package]
name = "zendiloos-ups"
description = "Bounded context UPS: a UPS through Network UPS Tools, when the NAS shuts down on battery, the devices that follow it, and what its state tells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Core crate of a bounded context: no I/O, no frameworks. Adapters live in
# zendiloos-infra and zendiloos-api. See docs/architecture.md, 2.1.
[dependencies]
zendiloos-kernel.workspace = true
zendiloos-jobs.workspace = true
zendiloos-notify.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
zendiloos-jobs = { workspace = true, features = ["testing"] }
zendiloos-notify = { workspace = true, features = ["testing"] }

[features]
# In-memory adapters, for tests here and in the API crate.
testing = ["zendiloos-jobs/testing", "zendiloos-notify/testing"]

[lints]
workspace = true
