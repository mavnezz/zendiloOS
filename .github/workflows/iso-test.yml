# The installation from the ISO (scripts/iso-test.sh, docs/testing.md), by
# hand: Actions → ISO test → Run workflow, with the architecture and the
# branch or tag. It builds the package and the ISO of that commit as CI
# does, then installs from it, unattended, into a fresh QEMU machine and
# checks the result. amd64 runs with KVM, in about half an hour; arm64 on
# an arm64 runner, which has no KVM, so QEMU emulates the machine (TCG)
# and it takes hours, most of them DKMS building ZFS. Not part of CI:
# every push would wait for it.
name: ISO test

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture of the ISO
        type: choice
        options: [arm64, amd64]
        default: arm64

permissions:
  contents: read

jobs:
  build:
    name: Package and ISO (${{ inputs.arch }})
    runs-on: ubuntu-24.04
    steps:
      # The whole history: a development build counts its version from the
      # last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tools
        run: |
          scripts/install-tools.sh just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xorriso

      - name: just deb
        env:
          ARCH: ${{ inputs.arch }}
        run: ZENDILOOS_VERSION="$(scripts/release-version.sh)" just deb "$ARCH"

      - name: Installation ISO
        env:
          ARCH: ${{ inputs.arch }}
        run: scripts/build-iso.sh dist/zendiloos_*_"$ARCH".deb dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: dist/zendiloos-*-netinst.iso
          if-no-files-found: error
          retention-days: 3

  test:
    name: Installation from the ISO (${{ inputs.arch }})
    needs: build
    # arm64's machine on an arm64 host: KVM, should the runner ever offer
    # it, or else emulated.
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: QEMU
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          case $ARCH in
            amd64) machine=(qemu-system-x86) ;;
            arm64) machine=(qemu-system-arm qemu-efi-aarch64) ;;
          esac
          sudo apt-get update -q
          # ipxe-qemu: the cards' option ROMs (efi-virtio.rom), which QEMU
          # loads even when nothing boots from the network.
          sudo apt-get install -y -q --no-install-recommends "${machine[@]}" ipxe-qemu qemu-utils xorriso jq curl
          # GitHub's x86 runners have KVM; /dev/kvm is root's until a rule
          # gives it to everyone.
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: dist

      - name: scripts/iso-test.sh
        env:
          ARCH: ${{ inputs.arch }}
        run: scripts/iso-test.sh dist/zendiloos-*-"$ARCH"-netinst.iso

      # What the installer and the installed system said on their consoles.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: iso-test-logs
          path: dev/iso-test/*.log
          retention-days: 14
