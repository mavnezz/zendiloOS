# Installed by zendiloOS (docs/architecture.md, 1.3 and 6). A NAS's system
# disk is often small and wears with what is written to it (eMMC, a USB
# stick): the journal keeps at most 512 MiB there, in files of up to
# 64 MiB, instead of a tenth of the file system up to 4 GiB. That bounds
# the room it takes; what it writes, zendiloOS keeps short (only changes at
# the level info). To keep more, set SystemMaxUse= in a file of your own in
# /etc/systemd/journald.conf.d/, which comes after this one. Takes effect
# when journald starts again, at the latest with the next boot.
[Journal]
SystemMaxUse=512M
SystemMaxFileSize=64M
