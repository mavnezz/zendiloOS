# Samba configuration of zendiloOS.
#
# The shares are in /etc/samba/zendiloos.conf, which zendiloOS writes from
# the web interface. Debian's original configuration was saved as
# /etc/samba/smb.conf.debian. Settings here may be changed; zendiloOS does
# not overwrite this file again.

[global]
   workgroup = WORKGROUP
   server string = zendiloOS
   server role = standalone server
   security = user
   passdb backend = tdbsam
   # No guest access: every share needs an account.
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB2_10
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   unix password sync = no
   pam password change = no
   obey pam restrictions = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   # macOS clients: resource forks in streams, Apple-style names.
   ea support = yes
   fruit:metadata = stream
   fruit:nfs_aces = no

include = /etc/samba/zendiloos.conf
