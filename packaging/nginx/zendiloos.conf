# zendiloOS web interface. Installed by the zendiloos package.

limit_req_zone $binary_remote_addr zone=zendiloos_auth:10m rate=10r/m;

map $http_upgrade $zendiloos_connection {
    default upgrade;
    ''      close;
}

upstream zendiloos_api {
    server unix:/run/zendiloos/api.sock;
}

# Plain HTTP only points to HTTPS: the session cookie is HTTPS-only.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_tokens off;

    ssl_certificate     /etc/zendiloos/tls/zendiloos.crt;
    ssl_certificate_key /etc/zendiloos/tls/zendiloos.key;
    # The oldest TLS version, as set in the control panel (ssl_protocols).
    include /etc/zendiloos/nginx/*.conf;
    ssl_session_cache   shared:zendiloos:10m;

    root /usr/share/zendiloos/webui;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # $http_host keeps the port: the API compares it with the Origin header.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $zendiloos_connection;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://zendiloos_api;
    }

    # Uploads in the file manager: any size, passed on as they arrive
    # instead of collected on the system disk first.
    location ~ ^/api/v1/files/shares/[0-9]+/upload$ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://zendiloos_api;
    }

    # A terminal in a container stays open while nothing is written to it;
    # zendiloosd pings every 30 seconds and ends it after half an hour idle.
    location ~ ^/api/v1/docker/containers/[^/]+/terminal$ {
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://zendiloos_api;
    }

    # Downloads (files and folders as archives) go straight to the browser.
    location ~ ^/api/v1/files/shares/[0-9]+/(download|archive)$ {
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://zendiloos_api;
    }

    # Password and setup code guessing, slowed down before it reaches zendiloosd;
    # each of these runs Argon2. X-Real-IP (set above for every location, never
    # taken from the client) is what an open setup checks to be the own network.
    location ~ ^/api/v1/(auth/login|auth/password|setup)$ {
        limit_req zone=zendiloos_auth burst=10 nodelay;
        proxy_pass http://zendiloos_api;
    }

    # File names contain a content hash.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # The interface is a single page; index.html is never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
