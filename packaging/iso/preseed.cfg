#### zendiloOS on Debian 13 (docs/releases.md, "Installation ISO")
#
# The installer asks only what belongs to this machine: language, location
# and keyboard, the machine's name, root's password and the disk for the
# system. That one is never chosen for you: on a NAS the wrong disk would
# cost data. Everything else is answered here, and at the end zendiloOS is
# installed from the ISO, with ZFS built for the kernel (DKMS).

### Network: DHCP on the first interface with a link; the name is asked.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string zendiloos
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string

### Packages from Debian's own mirror, with contrib for ZFS.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

### Accounts: root only, with the password asked. People get their
### accounts in zendiloOS's own setup.
d-i passwd/make-user boolean false

### The clock runs in UTC; the time zone follows the location.
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Partitioning is asked: the disk, the layout, the confirmation.

### The system: standard tools and SSH, the kernel's headers for DKMS, all
### of it current.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string linux-headers-amd64
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
zfs-dkms zfs-dkms/note-incompatible-licenses note

### The boot loader goes with Debian; on BIOS machines with several disks
### the disk is asked.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

### zendiloOS, then a restart into it. Its setup is open: no setup code,
### whoever first opens the web interface from the own network creates the
### administrator (the marker in zendiloosd's state directory, which systemd
### hands to the service at its first start). The console then shows the
### address of the web interface.
### What apt says goes to /var/log/zendiloos-install.log on the new system.
d-i preseed/late_command string \
    cp /cdrom/zendiloos/zendiloos_*.deb /target/tmp/ ; \
    in-target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install --yes /tmp/zendiloos_*.deb \
        >/var/log/zendiloos-install.log 2>&1 </dev/null; status=$?; rm -f /tmp/zendiloos_*.deb; \
        install -d -m 0700 /var/lib/zendiloos && touch /var/lib/zendiloos/setup-open; exit $status'
d-i finish-install/reboot_in_progress note
