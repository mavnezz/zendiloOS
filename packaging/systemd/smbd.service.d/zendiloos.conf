# Installed by zendiloOS (docs/architecture.md, 4.4). smbd works on the
# shares as root (force user = root), so file permissions keep it from no
# device file a share holds. The shares are mounted nodev, but a snapshot's
# automount or a pool brought in need not be: a block device's node in one
# would let a share's user read the system disk as root. smbd needs no
# device but the pseudo ones DevicePolicy=closed leaves (/dev/null, zero,
# full, random, urandom, tty, ptmx), whatever the mounts say.
[Service]
DevicePolicy=closed
