# Written by zendiloOS. GRUB starts the entry zendiloOS saves: the newest
# kernel that has its ZFS module, never a newer one before DKMS built the
# module for it, so the NAS does not come up without its pools. The kernel
# hooks /etc/kernel/*.d/zz-zendiloos and every update set it
# (zendiloos-agent choose-boot-kernel; docs/architecture.md, 4.10).
GRUB_DEFAULT=saved
GRUB_SAVEDEFAULT=false
