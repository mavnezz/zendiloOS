# Fixed ports for NFSv3's helpers, so the firewall's NFS service (with
# rpcbind on 111 and NFS on 2049) can name them; they apply once the NFS
# services start again (a restart of the NAS). Installed by the zendiloos
# package.
[mountd]
port=20048

[statd]
port=32765
outgoing-port=32766

[lockd]
port=32768
udp-port=32768
