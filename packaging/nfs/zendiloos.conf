# Fixed ports for NFSv3's helpers, so the firewall's NFS service (with
# rpcbind on 111 and NFS on 2049) can name them; they apply once the NFS
# services start again (a restart of the NAS). All below the range Linux
# hands out for outgoing connections (32768 to 60999), so no connection of
# another program can hold one of them first. Installed by the zendiloos
# package.
[mountd]
port=20048

[statd]
port=32765
outgoing-port=32766

[lockd]
port=32767
udp-port=32767
